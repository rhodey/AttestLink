# NSM sets the initial clock before this daemon starts. NTS is always required.
server time.cloudflare.com iburst nts maxdelay 0.25
server 1.ntp.ubuntu.com iburst nts maxdelay 0.25
server sth1.nts.netnod.se iburst nts maxdelay 0.25
authselectmode require
minsources 2
nosystemcert
ntstrustedcerts /etc/ssl/certs/ca-certificates.crt

# Bound accepted network uncertainty and corrections. No clock steps after boot.
maxdistance 0.5
maxchange 1 0 0
maxdrift 100
maxslewrate 100
leapsecmode slew
maxclockerror 100

# State is private and ephemeral. Only read-only monitoring is exposed to SSH
# users on loopback; privileged chronyc commands use the protected Unix socket.
driftfile /run/chrony/drift
ntsdumpdir /run/chrony
pidfile /run/chrony/chronyd.pid
bindcmdaddress /run/chrony/chronyd.sock
bindcmdaddress 127.0.0.1
opencommands activity authdata sources sourcestats sourcename tracking
port 0
