[package]
name = "attest-link-rust"
version = "0.6.1"
description = "Attestation generation and verification for Nitro Enclaves and Sandboxes"
edition = "2021"
license = "MIT"
publish = false
# Verifier unit tests are included by src/verify.rs.
autotests = false

[features]
wasm = []

[[bin]]
name = "attest-link-rust"
path = "src/main.rs"

[[bin]]
name = "attest-link-wasm"
path = "src/bin/wasm.rs"
required-features = ["wasm"]

[[test]]
name = "cli"
path = "tests/cli.rs"

[dependencies]
base64 = "=0.23.1"
ciborium = "=0.2.2"
hex = "=0.4.3"
openssl = "=0.10.82"
rmp-serde = "=1.3.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(any(target_os = "emscripten", target_os = "macos"))'.dependencies]
openssl = { version = "=0.10.82", features = ["vendored"] }

[target.'cfg(target_os = "linux")'.dependencies]
aws-nitro-enclaves-nsm-api = "=0.5.2"
serde_bytes = "=0.11.19"

[profile.release]
strip = true
lto = true
codegen-units = 1
